<main class="main-blog-preview">
    <div class="blog-header">
        <h1>Blog</h1>
        <p class="blog-description">Essays and notes</p>
    </div>

    <article class="featured-spotlight" *ngIf="featuredPost" (click)="openPost(featuredPost)">
        <div class="spotlight-meta">
            <span class="meta-label">latest</span>
            <span class="meta-sep">·</span>
            <span>{{ featuredPost.date }}</span>
            <span class="meta-sep">·</span>
            <span>{{ featuredPost.readingTime }} min read</span>
        </div>
        <h2 class="spotlight-title">{{ featuredPost.title }}</h2>
        <p class="spotlight-summary">{{ featuredPost.summary }}</p>
        <span class="spotlight-cta">Continue reading →</span>
    </article>

    <div class="post-index" *ngIf="recentPosts.length">
        <span class="index-label">more from the blog</span>
        <ul class="index-list">
            <li *ngFor="let post of recentPosts; let i = index">
                <button class="index-row" (click)="openPost(post)">
                    <span class="index-number">{{ (i + 2).toString().padStart(2, '0') }}</span>
                    <span class="index-title">{{ post.title }}</span>
                    <span class="index-meta">
                        <span>{{ post.date }}</span>
                        <span class="meta-sep">·</span>
                        <span>{{ post.readingTime }} min</span>
                    </span>
                </button>
            </li>
        </ul>
    </div>

    <div class="blog-footer">
        <button class="view-all" (click)="viewAll()">View all posts →</button>
    </div>
</main>
